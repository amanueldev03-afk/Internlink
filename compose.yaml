services:
  postgres:
    image: postgres:16-alpine
    container_name: internlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: internlink
      POSTGRES_USER: internlink
      POSTGRES_PASSWORD: internlink
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U internlink -d internlink']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: internlink-redis
    restart: unless-stopped
    command: redis-server --requirepass internlink
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'internlink', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: internlink-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    command: server /data --console-address ':9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: internlink-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://internlink:internlink@postgres:5432/internlink?schema=public
      REDIS_URL: redis://:internlink@redis:6379
      JWT_SECRET: change-me-in-production
      NODE_ENV: development
    ports:
      - '3001:3001'
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    container_name: internlink-worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://:internlink@redis:6379
      NODE_ENV: development
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    container_name: internlink-web
    depends_on:
      api:
        condition: service_started
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - '5173:80'
    restart: unless-stopped

  ai-service:
    profiles: ['ai']
    build:
      context: .
      dockerfile: infrastructure/docker/ai.Dockerfile
    container_name: internlink-ai-service
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    ports:
      - '8000:8000'
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
