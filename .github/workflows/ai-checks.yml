name: AI checks

on: [push, pull_request]

jobs:
  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: cd services/ai-service && python -m venv .venv && . .venv/bin/activate && PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cpu pip install -e '.[dev]' && pytest -q
